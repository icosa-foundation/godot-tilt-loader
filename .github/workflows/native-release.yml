name: Native GDExtension Release

on:
  push:
    tags:
      - "open-brush-hull-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version for an artifact-only manual build.
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/native-ci.yml

  package:
    name: Assemble complete native package
    needs: native
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Restore pinned dependency checkouts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps
          key: native-deps-${{ hashFiles('native/open_brush_hull/dependencies.json') }}

      - name: Fetch pinned dependency licenses
        run: python native/open_brush_hull/tools/setup_dependencies.py

      - name: Download every native matrix artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: open-brush-hull-*-template_*
          path: native/open_brush_hull/bin
          merge-multiple: true

      - name: Determine release metadata
        id: metadata
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#open-brush-hull-v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate and package
        env:
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.source_date_epoch }}
        run: |
          python native/open_brush_hull/tools/validate_package.py
          python native/open_brush_hull/tools/package_release.py \
            --version "${{ steps.metadata.outputs.version }}" \
            --source-commit "${GITHUB_SHA}" \
            --output-dir dist

      - name: Upload complete release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: open-brush-hull-${{ steps.metadata.outputs.version }}
          path: |
            dist/open_brush_hull-${{ steps.metadata.outputs.version }}.zip
            dist/open_brush_hull-${{ steps.metadata.outputs.version }}.zip.sha256
          if-no-files-found: error

      - name: Attach package to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "open_brush_hull ${{ steps.metadata.outputs.version }}" \
              --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/open_brush_hull-${{ steps.metadata.outputs.version }}.zip" \
            "dist/open_brush_hull-${{ steps.metadata.outputs.version }}.zip.sha256" \
            --clobber
