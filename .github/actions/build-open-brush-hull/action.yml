name: Build open_brush_hull
description: Set up a pinned toolchain and build one open_brush_hull matrix entry.

inputs:
  platform:
    description: Godot target platform.
    required: true
  arch:
    description: Godot target architecture.
    required: true
  target:
    description: template_debug or template_release.
    required: true
  scons-version:
    description: SCons version.
    required: true
  emscripten-version:
    description: Emscripten version.
    required: true
  android-ndk-version:
    description: setup-ndk version name.
    required: true
  android-ndk-package-version:
    description: Fully qualified NDK package version used by godot-cpp.
    required: true
  android-api-level:
    description: Android API level.
    required: true
  godot-api-version:
    description: Minimum Godot API generated by godot-cpp.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: "3.12"

    - name: Set up Android NDK
      if: inputs.platform == 'android'
      uses: nttld/setup-ndk@2817442ee7c3346c1eb7d2ec60263c93206ba14f
      with:
        ndk-version: ${{ inputs.android-ndk-version }}
        link-to-sdk: true

    - name: Set up Emscripten
      if: inputs.platform == 'web'
      uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021
      with:
        version: ${{ inputs.emscripten-version }}
        no-cache: true

    - name: Install SCons
      shell: bash
      run: python -m pip install "scons==${{ inputs.scons-version }}"

    - name: Fetch pinned dependencies
      shell: bash
      run: python native/open_brush_hull/tools/setup_dependencies.py

    - name: Build extension
      shell: bash
      working-directory: native/open_brush_hull
      run: |
        arguments=(
          "platform=${{ inputs.platform }}"
          "arch=${{ inputs.arch }}"
          "target=${{ inputs.target }}"
          "precision=single"
          "api_version=${{ inputs.godot-api-version }}"
        )
        if [[ "${{ inputs.platform }}" == "web" ]]; then
          arguments+=("threads=no")
        fi
        if [[ "${{ inputs.platform }}" == "android" ]]; then
          arguments+=(
            "ndk_version=${{ inputs.android-ndk-package-version }}"
            "android_api_level=${{ inputs.android-api-level }}"
          )
        fi
        if [[ "${{ inputs.platform }}" == "linux" && "${{ inputs.arch }}" == "arm32" ]]; then
          export OPEN_BRUSH_HULL_CC=arm-linux-gnueabihf-gcc
          export OPEN_BRUSH_HULL_CXX=arm-linux-gnueabihf-g++
          export OPEN_BRUSH_HULL_AR=arm-linux-gnueabihf-ar
          export OPEN_BRUSH_HULL_RANLIB=arm-linux-gnueabihf-ranlib
        fi
        scons "${arguments[@]}"

    - name: Inspect binary format, architecture, and entry symbol
      shell: bash
      run: >-
        python native/open_brush_hull/tools/inspect_binary.py
        --platform "${{ inputs.platform }}"
        --arch "${{ inputs.arch }}"
        --target "${{ inputs.target }}"

    - name: Remove Windows linker intermediates
      if: inputs.platform == 'windows'
      shell: bash
      run: >-
        find native/open_brush_hull/bin/windows -type f
        \( -name '*.exp' -o -name '*.lib' -o -name '*.pdb' \) -delete
